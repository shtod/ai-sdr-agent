<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AI SDR Agent{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; background: #f5f7fa; color: #1f2329; }
  a { color: #2563eb; text-decoration: none; }

  /* 顶部栏 + 导航菜单 */
  .topbar { background: #1f2937; color: #fff; }
  .topbar-inner { max-width: 1100px; margin: 0 auto; padding: 14px 16px;
                  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .brand { font-size: 17px; font-weight: 700; }
  .brand small { font-weight: 400; color: #9ca3af; font-size: 12px; margin-left: 8px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav a { color: #d1d5db; padding: 7px 14px; border-radius: 7px; font-size: 14px; }
  nav a:hover { color: #fff; background: rgba(255,255,255,.08); }
  nav a.active { color: #fff; background: #2563eb; }
  .nav-badge { display: inline-block; margin-left: 6px; background: #ef4444; color: #fff;
               border-radius: 999px; font-size: 11px; padding: 1px 7px; font-weight: 600; }

  .wrap { max-width: 1100px; margin: 22px auto; padding: 0 16px; }
  .page-title { font-size: 20px; margin: 0 0 16px; }
  .panel { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px;
           box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .flash { background: #e8f5e9; color: #1b5e20; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
  .hint { font-size: 12px; color: #6b7280; }

  textarea, input, select { font-size: 14px; padding: 8px 10px; border: 1px solid #d1d5db;
                            border-radius: 6px; width: 100%; }
  textarea { min-height: 90px; }
  label { display: block; font-size: 13px; color: #374151; margin: 10px 0 4px; }
  button { background: #2563eb; color: #fff; border: 0; padding: 10px 18px; border-radius: 6px;
           cursor: pointer; font-size: 14px; }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  #loading { display: none; margin-top: 10px; color: #2563eb; font-size: 14px; }

  /* 统计卡片 */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat { background: #fff; border-radius: 10px; padding: 16px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .stat .num { font-size: 28px; font-weight: 700; }
  .stat .lbl { font-size: 13px; color: #6b7280; margin-top: 4px; }
  .stat.high .num { color: #b91c1c; }
  .stat.medium .num { color: #b45309; }
  .stat.low .num { color: #1d4ed8; }

  /* 线索表格 */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #e5e7eb; }
  th { background: #f9fafb; color: #374151; }

  /* 卡片 / 徽标 */
  .card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin-bottom: 16px; background: #fff; }
  .card-header { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .badge { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.high { background: #fee2e2; color: #b91c1c; }
  .badge.medium { background: #fef3c7; color: #b45309; }
  .badge.low { background: #dbeafe; color: #1d4ed8; }
  .badge.review { background: #f3e8ff; color: #7c3aed; }
  .badge.gray { background: #f3f4f6; color: #6b7280; }

  .cols { display: flex; gap: 16px; flex-wrap: wrap; }
  .col { flex: 1 1 420px; min-width: 320px; }
  pre { background: #f9fafb; padding: 12px; border-radius: 8px; white-space: pre-wrap;
        font-size: 13px; line-height: 1.6; }
  .meta { font-size: 13px; color: #4b5563; background: #f9fafb; padding: 10px; border-radius: 8px; }
  .others { font-size: 12px; color: #6b7280; margin-top: 10px; }
  .batch-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .empty { color: #6b7280; text-align: center; padding: 40px 0; }
  .empty a { font-weight: 600; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">AI SDR Agent<small>电话记录 → 结构化 SQL 线索 → 低置信度复核</small></div>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if active == 'dashboard' }}">概览</a>
      <a href="{{ url_for('add') }}" class="{{ 'active' if active == 'add' }}">录入线索</a>
      <a href="{{ url_for('leads') }}" class="{{ 'active' if active == 'leads' }}">全部线索</a>
      <a href="{{ url_for('review') }}" class="{{ 'active' if active == 'review' }}">待复核{% if pending_count %}<span class="nav-badge">{{ pending_count }}</span>{% endif %}</a>
      <a href="{{ url_for('feedback') }}" class="{{ 'active' if active == 'feedback' }}">反馈样本</a>
    </nav>
  </div>
</header>
<main class="wrap">
  {% for m in get_flashed_messages() %}
    <div class="flash">{{ m }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
